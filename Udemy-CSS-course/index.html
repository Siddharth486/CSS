<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Center Elements</title>
    <style>
      body{
        background-image: url('../brandenburgertor.jpg');
        background-repeat:no-repeat;
        /*background-size:contain; /*image gets contained in an element*/
        background-size:cover; /*covers the entire screen*/
        /* background-attachment: scroll; background-image will also scroll on scrolling */ 
        background-attachment:fixed; /*background image will now be fixed not scroll*/
      }
      div{
        border: 5px solid black;
        width:20%;
        height: 200px;
        margin:5px;
      }
      .alpha{
        background-color: rgba(100, 0, 0, 0.2); //* rgba(red, green ,blue, alpha_value) alpha_value lies from 0 to 1 where 0 is the lightest and 1 is the darkest*/
      }
      .opacity{
        background-color: blue;
        opacity: 0.3; /*value lies between 0 to 1 ,border bhi light hoga saath*/
      }
    </style>
    </head>
    <body>
     <div class="alpha"></div>
     <div class="opacity"></div>
    </body>
</html>
