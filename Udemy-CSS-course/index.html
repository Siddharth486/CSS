<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Center Elements</title>
    <style>
      div{
        border: 5px solid black;
        width:20%;
        height: 200px;
        margin:5px;
      }
      /*in css gradient is treated as image*/
      .linear__gradient{
        background-image: linear-gradient(to top left, red, blue, green, orange, pink);
                                         /*position, colors separated with comma*/
      }
      .radial__gradient{
        background-image: radial-gradient(black 30%, white 31%, transparent 45%), url('../universe.jpg');
        /* adding effect on image */
      }
    
    </style>
    </head>
    <body>
      <div class="linear__gradient"></div>
        <div class="radial__gradient"></div>
    </body>
</html>
